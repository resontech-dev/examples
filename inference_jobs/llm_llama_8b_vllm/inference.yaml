# Llama 3.1 8B served via vLLM with tensor parallelism (TP=2).
# The reference 8B-class deployment: production-grade chat model, ~16 GB
# fp16, comfortably fits on 2× consumer GPUs via TP=2. Single A100/H100
# can run it without TP — drop tensor_parallel_size to 1 in serve_module.py.
#
# IMPORTANT: meta-llama/Meta-Llama-3.1-8B-Instruct is a GATED model on
# HuggingFace. Before deploying:
#   1. Accept the license at https://huggingface.co/meta-llama/Meta-Llama-3.1-8B-Instruct
#   2. Create a HF token with "read" scope at https://huggingface.co/settings/tokens
#   3. Set HUGGING_FACE_HUB_TOKEN in the dispatcher env (or pass it via
#      the platform's secret manager). The platform forwards it to each
#      replica's runtime env so vLLM can pull the weights.
# Without the token, vLLM's __init__ will fail with a 401 from HF Hub.

engine: vllm_openai

cluster:
  num_workers: 1
  mode: "tensor_parallel"
  gpus_per_worker: 1
  cpus_per_worker: 8
  max_ongoing_requests: 32

requirements:
  # Do NOT redeclare ray here — see template 05's inference.yaml for the
  # ResolutionImpossible explanation. The platform's base_requirements.txt
  # must include `ray[serve,llm]==<version>` for vLLM templates to work.
  # 0.18.0 has a known mistral-common metadata bug — see template 05.
  - "vllm>=0.18.1"
  - "transformers>=4.45.0"
  - "huggingface_hub>=0.24"
