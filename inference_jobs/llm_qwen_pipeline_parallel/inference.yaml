# Qwen 7B served via vLLM with pipeline parallelism (PP=2 across 2 nodes).
# Transformer layers are split into 2 stages: stage 0 runs the first half
# of the layers, stage 1 runs the second half. Activations flow between
# stages via gRPC over the cluster network, not NCCL. Best when you have
# multiple nodes each with one modest GPU and no single GPU big enough.

engine: vllm_openai

cluster:
  num_workers: 1
  mode: "pipeline_parallel"
  gpus_per_worker: 1
  cpus_per_worker: 8
  max_ongoing_requests: 32

requirements:
  # Do NOT redeclare ray here — see template 05's inference.yaml for the
  # ResolutionImpossible explanation. The platform's base_requirements.txt
  # must include `ray[serve,llm]==<version>` for vLLM templates to work.
  # 0.18.0 has a known mistral-common metadata bug — see template 05.
  - "vllm>=0.18.1"
  - "transformers>=4.45.0"
