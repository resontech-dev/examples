# gpt-oss-safeguard-20b via vLLM: policy-as-prompt safety classifier.
#
# OpenAI's safety reasoning model (October 2025): the same 21B MoE / 3.6B
# active / MXFP4 (~13 GB) shape as gpt-oss-20b, fine-tuned to read a
# written policy in the system message and classify the user message
# against it. No retraining when the policy changes. One 16 GB card as
# configured; 24 GB gives it a real KV pool for long policies.
#
# This is a background / sampled auditor, not an inline gate: every
# verdict is preceded by reasoning and takes seconds. Pair it with a small
# fast guard (Qwen3Guard-0.6B in the agents bundle) for the hot path.

engine: vllm_openai

model:
  module: "serve_module"    # python module exporting `app` — feeds import_path

# Scheduling declaration — MUST equal engine_kwargs values of the same
# name in serve_module.py (the SDK cross-checks at submit and refuses
# to upload on mismatch).
vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"               # vllm_openai requires gpu
  gpus_per_worker: 1
  cpus_per_worker: 4
  min_vram_gb_per_worker: 14  # 13 GB weights + ~0.9 GB KV + overhead on a 16 GB card
  # Advisory fields — dashboard/accounting only, never forwarded to vLLM:
  mode: "data_parallel"
  max_ongoing_requests: 8

# No `requirements:` block on purpose. vLLM jobs run on the platform's
# prebuilt ray-llm image (ray[serve,llm]==2.55.1 + vllm==0.18.0 + torch
# cu128) — never re-declare ray / vllm / torch / transformers here.
# See ../README.md "Requirements policy".
