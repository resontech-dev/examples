# MamayLM 12B (Gemma 3, Ukrainian-adapted) int4 via vLLM — one 16 GB card.
#
# The fastest way to try a Ukrainian-tuned model on a single consumer
# card: community W4A16 (compressed-tensors) build of MamayLM 12B,
# ~8 GB of weights, 16k context with room for 4–8 concurrent chats.
#   "assistant" → MamayLM-Gemma-3-12B W4A16   /v1/chat/completions (text; image input if the
#                                              vision tower survived quantization — see serve_module.py)
#
# ⚠️ Community checkpoint with no model card — VERIFY (serve_module.py lists
# official fallbacks). License: Gemma Terms of Use.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 10  # ~8 GB int4 weights + KV; 16 GB as configured
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:` — the prebuilt ray-llm image owns the stack.
