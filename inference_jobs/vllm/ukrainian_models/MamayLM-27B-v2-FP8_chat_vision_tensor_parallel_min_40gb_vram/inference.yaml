# MamayLM 27B v2.0 (Gemma 3 27B, Ukrainian-adapted) official FP8 via vLLM —
# TENSOR PARALLEL over 2 GPUs in ONE worker.
#
# The quality tier for Ukrainian: INSAIT's own FP8-dynamic build (~30 GB,
# vision tower kept in bf16). Sharded across 2×24 GB (4090) or 2×32 GB
# (5090 / RTX PRO 4500); a single 48 GB card runs it at TP=1.
#   "assistant" → INSAIT-Institute/MamayLM-Gemma-3-27B-IT-v2.0-FP8-dynamic   /v1/chat/completions
#
# FP8 weights need compute capability ≥ 8.9 (Ada, Blackwell) — Ampere
# cards (3090, A5000) cannot run this checkpoint. License: Gemma Terms of Use.

engine: vllm_openai

model:
  module: "serve_module"

# TP=2 → one worker exposing 2 GPUs; per-GPU check: ≥ min_vram ÷ 2 = 20 GB.
vllm:
  tensor_parallel_size: 2
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 2
  cpus_per_worker: 8
  min_vram_gb_per_worker: 40  # 2 × (15 GB weight shard + KV + overhead)
  # Advisory fields — dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 16

# No `requirements:` — the prebuilt ray-llm image owns the stack.
