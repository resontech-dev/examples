# Agents bundle — Qwen3-8B chat + embed + rerank (+ optional guard) on ONE 16 GB card.
#
# The smallest complete assistant stack on one consumer card: one chat
# model for every text task (classification, Q&A, drafting, answer checks),
# the RAG sidecars, and an optional guard:
#   "assistant" → Qwen3-8B AWQ             /v1/chat/completions (tool calling on)
#   "embed"     → Qwen3-Embedding-0.6B     /v1/embeddings
#   "rerank"    → Qwen3-Reranker-0.6B      /v1/score
#   "guard"     → Qwen3Guard-Gen-0.6B      /v1/chat/completions  (WITH_GUARD = True in serve_module.py)
#
# gpu_memory_utilization fractions sum to 0.85 (each engine pre-allocates
# at boot) — see serve_module.py for the 16 GB budget.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 12  # ~5.9 GB chat AWQ + 2×1.2 GB sidecars + KV; 16 GB as configured
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
