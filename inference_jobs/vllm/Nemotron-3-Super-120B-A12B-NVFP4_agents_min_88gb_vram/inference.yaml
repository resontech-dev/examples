# Nemotron 3 Super 120B-A12B (NVIDIA NVFP4) via vLLM: text reasoning + agents.
#
# NEEDS the Ray 2.60.0 image (vLLM 0.29.0, CUDA 13, driver R580+) and a
# Blackwell card (NVFP4). Prod stays on Ray 2.55.1 until the switch.
# Written 2026-11-18; nothing has booted.
#
#   "assistant" -> nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4   /v1/chat/completions
#
# 80.3 GB checkpoint -> one RTX PRO 6000 Blackwell 96 GB (vLLM recipe) or
# one B200. FP8 variant on 2x H100: README. NVIDIA Nemotron Open Model License.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 16
  min_vram_gb_per_worker: 88   # 80.3 GB weights + KV and Mamba state for 262k x 8
  min_compute_capability: 10.0 # Blackwell: NVFP4 (B200 10.0, RTX PRO 6000 12.0)
  min_driver_version: "580"    # CUDA 13 in the Ray 2.60 image
  min_disk_gb_per_worker: 130  # image + 1.3 x 80.3 GB checkpoint
  min_host_ram_gb_per_worker: 128   # weights load through host RAM; the first kernel compile is heavy
  # Advisory fields: dashboard/accounting only.
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:`: the prebuilt ray-llm image owns the stack.
