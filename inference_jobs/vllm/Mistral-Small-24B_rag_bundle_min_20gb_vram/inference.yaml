# Mistral Small 24B RAG bundle — chat + embeddings + reranker on ONE worker.
#
# Three vLLM engines behind one OpenAI endpoint:
#   "assistant" → Mistral Small 24B AWQ      /v1/chat/completions
#   "embed"     → Qwen3-Embedding-0.6B       /v1/embeddings
#   "rerank"    → Qwen3-Reranker-0.6B        /v1/score
#
# gpu_memory_utilization fractions must sum to ~0.85 (each engine
# pre-allocates at boot) — see serve_module.py for the budget.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 22  # 13.2 (chat) + 2×1.2 (sidecars) + KV + overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
