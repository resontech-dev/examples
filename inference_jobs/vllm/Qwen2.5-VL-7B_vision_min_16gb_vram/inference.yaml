# Qwen2.5-VL-7B (fp16) via vLLM — document vision on one 24 GB worker.
#
# The practical doc-understanding workhorse (`vision-qwen25-vl-7b`, v1):
# invoices, scans, receipts, screenshots, dashboards → structured JSON.
# Vision-language requests ride the standard OpenAI chat route with
# image content parts — no separate API.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 20  # 16.6 GB fp16 weights + KV/vision buffers + overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:` — the prebuilt ray-llm image owns the stack.
