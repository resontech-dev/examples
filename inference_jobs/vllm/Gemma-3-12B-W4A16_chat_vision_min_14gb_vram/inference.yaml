# Gemma 3 12B (W4A16) via vLLM: text + vision on one 16 GB card.
#
#   "assistant" -> RedHatAI/gemma-3-12b-it-quantized.w4a16   /v1/chat/completions (text + images)
#
# Red Hat AI INT4 build, 10.4 GB, vision tower kept bf16.
# License: Gemma Terms of Use (prohibited-use policy; not Apache).

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 14  # 10.4 GB weights + activations + KV for one 16k chat
  # Advisory fields: dashboard/accounting only.
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:`: the prebuilt ray-llm image owns the stack.
