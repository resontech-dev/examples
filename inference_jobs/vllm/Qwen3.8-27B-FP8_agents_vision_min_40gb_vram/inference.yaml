# Qwen3.8-27B (official FP8) via vLLM: text + vision assistant for agents.
#
# NEEDS the Ray 2.60.0 image (vLLM 0.29.0, CUDA 13, driver R580+).
# Written 2026-11-19; nothing has booted.
#
#   "assistant" -> Qwen/Qwen3.8-27B-FP8   /v1/chat/completions (text, images, tool calling)
#
# ~31 GB of weights -> one 48 GB card as configured, one H100 for 131k
# context, one 96 GB card or H200 for 262k. Apache-2.0.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1     # 2 for 2x24 GB (and gpus_per_worker: 2, engine_kwargs too)
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1          # 2 for the TP=2 shape: both GPUs in ONE worker
  cpus_per_worker: 8
  min_vram_gb_per_worker: 40  # ~31 GB weights + activations + KV for one 64k chat
  min_compute_capability: 8.9 # native FP8 (Ada, Hopper, Blackwell)
  min_driver_version: "580"   # CUDA 13 in the Ray 2.60 image
  min_disk_gb_per_worker: 70  # image + 1.3 x ~31 GB checkpoint
  # Advisory fields: dashboard/accounting only.
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:`: the prebuilt ray-llm image owns the stack.
