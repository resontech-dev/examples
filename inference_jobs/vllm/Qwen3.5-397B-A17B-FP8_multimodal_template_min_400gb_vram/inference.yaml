# ⚠️ TEMPLATE: Qwen3.5-397B-A17B (official FP8) via vLLM, TP=8 on one 8-GPU node.
#
# The first large model on the platform: text + image, 262K context,
# Apache-2.0, one node (`reson_docs/docs/inference/run_qwen_3.5-397B-A17B_plan.md`).
# NOT deployable on the current fleet: it needs ONE worker with 8 datacenter
# GPUs joined by NVLink (8× H200 target, 8× H100 80 GB fallback). The plan's
# steps 1 to 4 (prove the family on today's fleet, platform spec items B/D/E,
# order the node, onboard it with the weights pre-staged) come before this
# job. Every number below is napkin math, UNVALIDATED on real hardware.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 8
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 8            # the whole node is one worker (TP never crosses machines)
  cpus_per_worker: 32           # tokenisation, image decode/resize, Ray + vLLM schedulers
  min_vram_gb_per_worker: 600   # checked per card: 600 ÷ 8 = 75 GB free on each (plan §7)
  min_disk_gb_per_worker: 550   # spec C: 1.3 × 400 GB + image; local NVMe, not network storage
  require_nvlink: true          # spec F: refuse a PCIe box (TP=8 at this size needs NVSwitch)
  # Spec items D and E are not shipped yet. Uncomment when they land
  # (reson_docs/docs/specs/hardware-aware-placement.md); until then the
  # limits in models_limits.md §2 apply (300 s per request, 32 MB bodies).
  # deploy_timeout_s: 3600      # spec D: a 400 GB load + CUDA graph capture takes minutes
  # max_request_mb: 64          # spec E: image bodies
  # request_timeout_s: 1800     # spec E: multi-minute reasoning
  # Advisory fields: dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 64

# No `requirements:` block. vLLM 0.18.0 on the pinned ray-llm image already
# registers Qwen3_5MoeForConditionalGeneration (plan §2); never re-declare
# ray / vllm / torch / transformers here. See ../README.md "Requirements policy".
