# ⚠️ TEMPLATE: Qwen3.5-397B-A17B (official FP8) via vLLM, TP=8 on one 8-GPU node.
#
# 397B MoE, text + image, 262K context, Apache-2.0, one node.
# NOT deployable on the current fleet: it needs ONE worker with 8 datacenter
# GPUs joined by NVLink (8× H200 target, 8× H100 80 GB fallback), with the
# weights pre-staged on local NVMe. Every number below is napkin math,
# UNVALIDATED on real hardware.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 8
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 8            # the whole node is one worker (TP never crosses machines)
  cpus_per_worker: 32           # tokenisation, image decode/resize, Ray + vLLM schedulers
  min_vram_gb_per_worker: 600   # checked per card: 600 ÷ 8 = 75 GB free on each
  min_disk_gb_per_worker: 550   # 1.3 × 400 GB + image; local NVMe, not network storage
  require_nvlink: true          # refuse a PCIe box (TP=8 at this size needs NVSwitch)
  # Not supported by the platform yet; uncomment when they are. Until then
  # the platform limits apply (600 s per request, 32 MB bodies).
  # deploy_timeout_s: 3600      # a 400 GB load + CUDA graph capture takes minutes
  # max_request_mb: 64          # image bodies
  # request_timeout_s: 1800     # multi-minute reasoning
  # Advisory fields: dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 64

# No `requirements:` block. vLLM 0.29.0 on the pinned ray-llm image
# registers Qwen3_5MoeForConditionalGeneration; never re-declare
# ray / vllm / torch / transformers here. See ../README.md "Requirements policy".
