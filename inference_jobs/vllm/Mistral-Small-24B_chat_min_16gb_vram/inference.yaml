# Mistral Small 24B (AWQ) via vLLM — single-worker business chat.
#
# The popular EU-deployment pick: low-refusal, fast dense 24B. AWQ 4-bit
# (~13 GB weights) on one 24 GB worker.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 16  # ~13.2 GB weights + KV + ~1 GB overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
# See ../README.md "Requirements policy".
