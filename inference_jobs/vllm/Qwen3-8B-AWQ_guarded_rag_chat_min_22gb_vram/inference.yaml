# Guarded RAG chat — Qwen3-8B chat + Qwen3Guard-8B + embed + rerank.
#
# FOUR vLLM engines behind one OpenAI endpoint on ONE 24 GB worker —
# the full user-facing stack, Apache-clean end to end:
#   "assistant" → Qwen3-8B AWQ (chat)        /v1/chat/completions
#   "guard"     → Qwen3Guard-Gen-8B          /v1/chat/completions (classifier)
#   "embed"     → Qwen3-Embedding-0.6B       /v1/embeddings
#   "rerank"    → Qwen3-Reranker-0.6B        /v1/score
#
# gpu_memory_utilization fractions must sum to ~0.85 (each engine
# pre-allocates at boot) — see serve_module.py for the budget.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 22  # 5.5 (chat) + ~8.5 (guard fp8) + 2×1.2 + KV
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
