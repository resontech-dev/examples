# GLM-4.5-Air RAG bundle — chat (TP=4) + embeddings + reranker, ONE worker.
#
# Four GPUs host the sharded chat model; the two 0.6B sidecars each land
# on one of those same GPUs. Engines behind one OpenAI endpoint:
#   "assistant" → GLM-4.5-Air AWQ, TP=4     /v1/chat/completions
#   "embed"     → Qwen3-Embedding-0.6B      /v1/embeddings
#   "rerank"    → Qwen3-Reranker-0.6B       /v1/score
#
# The yaml vllm: block declares the LARGEST engine's parallelism (the
# scheduler sizes hardware for the chat model; the sidecars are TP=1
# and fit in its margins).

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 4
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 4
  cpus_per_worker: 8
  min_vram_gb_per_worker: 88  # chat shards (4×~15+KV) + two 0.6B sidecars
  # Advisory fields — dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
