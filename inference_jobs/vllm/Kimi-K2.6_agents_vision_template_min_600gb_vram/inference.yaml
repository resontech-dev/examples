# ⚠️ TEMPLATE: Kimi K2.6 (INT4 QAT) via vLLM, TP=8 on one 8× H200 node. Text + image.
#
# NEEDS the Ray 2.60.0 image (vLLM 0.29.0, CUDA 13, driver R580+).
# NOT deployable on the current fleet: one
# worker with 8 NVLinked H200 or B200 and the 595 GB checkpoint pre-staged on
# local NVMe. Requires trust_remote_code (see serve_module.py). Every number
# is napkin math. Licence: Modified MIT.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 8
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 8            # the whole node is one worker
  cpus_per_worker: 32           # tokenisation, image decode, Ray + vLLM schedulers
  min_vram_gb_per_worker: 880   # checked per card: 880 ÷ 8 = 110 GB free on each (H200, B200)
  min_compute_capability: 9.0
  min_driver_version: "580"     # CUDA 13 in the Ray 2.60 image
  min_disk_gb_per_worker: 800   # 1.3 × 595 GB + image; local NVMe
  min_host_ram_gb_per_worker: 1024
  require_nvlink: true
  # Advisory fields: dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 64

# No `requirements:` block: the ray-llm image owns the stack (tiktoken is in the lock).
