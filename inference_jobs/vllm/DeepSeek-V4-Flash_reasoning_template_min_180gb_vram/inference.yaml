# ⚠️ TEMPLATE: DeepSeek V4-Flash (0731) via vLLM, TP=4 + expert parallel on one 4-GPU node.
#
# NEEDS the Ray 2.60.0 image (vLLM 0.29.0, CUDA 13, driver R580+).
# NOT deployable on the consumer fleet: one
# worker with 4 NVLinked datacenter GPUs (4x H200 target, 4x H100 or 8x H100
# fallback) and the 167 GB checkpoint pre-staged on local NVMe. Every number
# is napkin math, unvalidated. MIT.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 4
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 4            # the 4 GPUs of one node are one worker (TP never crosses machines)
  cpus_per_worker: 32
  min_vram_gb_per_worker: 300   # checked per card: 300 ÷ 4 = 75 GB free on each
  min_compute_capability: 9.0   # Hopper or Blackwell: FP8 + DeepGEMM
  min_driver_version: "580"     # CUDA 13 in the Ray 2.60 image
  min_disk_gb_per_worker: 250   # 1.3 × 167 GB + image; local NVMe, not network storage
  min_host_ram_gb_per_worker: 256
  require_nvlink: true          # TP=4 + EP all-to-all needs NVLink
  # Advisory fields: dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 64

# No `requirements:` block: the ray-llm image owns the stack.
