# Qwen2.5-VL-7B (AWQ) via vLLM — BFSI document ingest (Stack A).
#
# The vision half of the banking_and_insurance pilot: scanned invoices,
# damage acts, police reports → structured JSON (see
# sectors/banking_and_insurance/bfsi_pilot/ingest.py — the real client).
# AWQ 4-bit ≈ 6 GB weights → fits a single 16 GB card, which is the
# pilot's whole GPU budget; max_model_len 8192 (single-page extraction
# needs no more) keeps the KV pool trivial.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 8   # ~6 GB AWQ weights + vision buffers + small KV
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 8

# No `requirements:` — the prebuilt ray-llm image owns the stack.
# See ../README.md "Requirements policy".
