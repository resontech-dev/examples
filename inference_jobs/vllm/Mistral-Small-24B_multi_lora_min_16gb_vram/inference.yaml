# Mistral Small 24B + N customer LoRA adapters via vLLM — one 24 GB worker.
#
# The EU-friendly mid-size LoRA base (`lora-mistral-small-24b`): one AWQ
# base in VRAM, customer adapters resolved on demand from S3, selected
# per request via model="mistral-24b:<adapter>".

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 18  # 13.2 GB base + adapters + KV + overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
