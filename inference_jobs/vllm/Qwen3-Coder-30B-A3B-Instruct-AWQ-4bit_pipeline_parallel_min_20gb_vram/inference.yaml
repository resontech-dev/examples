# Qwen3-Coder-30B-A3B via vLLM — PIPELINE PARALLEL across 2 workers.
#
# Stage-0 shape (see reson_docs/docs/inference/vllm/plan16-jul-2026.md):
# one replica split into 2 pipeline stages, one stage per single-GPU
# worker. Each 12 GB card holds ~9 GB of weights-stage + KV. Tokens flow
# stage 0 → stage 1 with one network hop per token, which is why PP
# works across ordinary workers where tensor parallelism cannot.

# ─────────────────────────────────────────────────────────────────────
# Engine discriminator. The platform's generate.py reads this and emits
# a serve_config.yaml whose import_path points at `serve_module:app` —
# bypassing the templates/serve_app.py Predictor wrapper.
# ─────────────────────────────────────────────────────────────────────
engine: vllm_openai

model:
  module: "serve_module"    # python module exporting `app` — feeds import_path

# Scheduling declaration — MUST equal engine_kwargs values of the same
# name in serve_module.py (the SDK cross-checks at submit and refuses
# to upload on mismatch). The backend selects workers from these:
# pipeline_parallel_size: 2 → this replica consumes TWO workers
# (1 worker = 1 stage), each with min_vram_gb_per_worker free.
vllm:
  tensor_parallel_size: 1     # GPUs per stage, must sit on ONE worker
  pipeline_parallel_size: 2   # workers chained per replica

cluster:
  num_workers: 2            # = replicas × pipeline_parallel_size
  device: "gpu"               # vllm_openai requires gpu
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 11  # ~9 GB stage + KV + overhead, rounded up
  # Advisory fields — dashboard/accounting only, never forwarded to vLLM:
  mode: "pipeline_parallel"
  max_ongoing_requests: 16

# No `requirements:` block on purpose. vLLM jobs run on the platform's
# prebuilt ray-llm image, which bakes the tested stack as one matched set:
# ray[serve,llm]==2.55.1 + vllm==0.18.0 + torch 2.10/cu128 + transformers.
# Never re-declare ray / vllm / torch / transformers / numpy here — the
# image owns them, and a customer `ray` line is rejected at submit.
# List ONLY genuinely extra packages (rare for vLLM jobs).
# See reson_docs/docs/inference/vllm/llmconfig.md §1 check 4.
