# Qwen3 4B RAG sidecars via vLLM: embeddings + reranker on ONE worker, no chat.
#
# The premium retrieval pair for clients whose chat model runs elsewhere
# (another card, another job, a bigger node) or who want better recall
# than the 0.6B sidecars inside the bundles:
#   "embed"  -> Qwen3-Embedding-4B   /v1/embeddings
#   "rerank" -> Qwen3-Reranker-4B    /v1/score
#
# Same model ids as every bundle, so Open WebUI / LiteLLM config does not
# change when a client moves from the 0.6B pair to this one.
#
# Both engines are fp8-quantized at load (~4.3 GB each instead of ~8 GB
# bf16) so the pair fits a 16 GB card. The critical knob is
# gpu_memory_utilization PER ENGINE: fractions must sum to ~0.85 and each
# engine needs a fixed KV cache. See serve_module.py.

engine: vllm_openai

model:
  module: "serve_module"

# Both engines are TP=1/PP=1: one worker hosts everything.
vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 4
  min_vram_gb_per_worker: 11  # 2 x (4.3 fp8 weights + 0.3 KV + 0.85 context) at short context
  # Advisory fields, dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 64

# No `requirements:`: the prebuilt ray-llm image owns the stack.
# See ../README.md "Requirements policy".
