# ⚠️ TEMPLATE: GLM-5.3 (FP8) via vLLM, TP=8 on one 8× H200 node. Text only.
#
# NEEDS the Ray 2.60.0 image (vLLM 0.29.0, CUDA 13, driver R580+); prod stays
# on Ray 2.55.1 until the switch. NOT deployable on the current fleet: one
# worker with 8 NVLinked H200 or B200 and the 755.7 GB checkpoint pre-staged
# on local NVMe. Every number is napkin math. Licence: glm-5.3 (MIT-like).

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 8
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 8            # the whole node is one worker
  cpus_per_worker: 32
  min_vram_gb_per_worker: 880   # checked per card: 880 ÷ 8 = 110 GB free on each (H200, B200)
  min_compute_capability: 9.0   # Hopper or Blackwell: FP8 + DeepGEMM
  min_driver_version: "580"     # CUDA 13 in the Ray 2.60 image
  min_disk_gb_per_worker: 1000  # 1.3 × 755.7 GB + image; local NVMe
  min_host_ram_gb_per_worker: 1024
  require_nvlink: true
  # Advisory fields: dashboard/accounting only:
  mode: "tensor_parallel"
  max_ongoing_requests: 64

# No `requirements:` block: the ray-llm image owns the stack.
