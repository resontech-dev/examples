# Nemotron 3.5 Content Safety via vLLM: multimodal guard (text + one image).
#
# 4B guard fine-tuned by NVIDIA from Gemma-3-4B-it (June 2026): standard
# safety taxonomy or a written custom policy, reasoning on/off per
# request, ~8.6 GB bf16 weights. One engine, one model id "guard". Runs
# alone on a 12-16 GB card as configured, or as a sidecar next to a chat
# engine (README "Sidecar").
#
# ⚠️ License is NOT Apache: OpenMDW-1.1 + Gemma Terms of Use + Gemma
# Prohibited Use Policy: see README before selling an endpoint on it.

engine: vllm_openai

model:
  module: "serve_module"    # python module exporting `app`: feeds import_path

# Scheduling declaration: MUST equal engine_kwargs values of the same
# name in serve_module.py (the SDK cross-checks at submit).
vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"               # vllm_openai requires gpu
  gpus_per_worker: 1
  cpus_per_worker: 4
  min_vram_gb_per_worker: 10  # 8.6 GB bf16 weights + vision tower + KV + overhead
  # Advisory fields: dashboard/accounting only, never forwarded to vLLM:
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:` block on purpose. vLLM jobs run on the platform's
# prebuilt ray-llm image (ray[serve,llm]==2.55.1 + vllm==0.18.0). The model
# card pins vllm>=0.11.0,<=0.20.2: the pinned image is inside that range.
# See ../README.md "Requirements policy".
