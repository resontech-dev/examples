# Qwen3-8B (AWQ) + Qwen3-Embedding-0.6B — BFSI agent bundle (Stack B).
#
# The chat half of the banking_and_insurance pilot: the claims-assistant
# agent (SQL tools + doc search) plus the embedding engine that fills
# pgvector — TWO engines in ONE deployment on ONE 16 GB card:
#   "assistant" → Qwen3-8B AWQ, hermes tool calling   /v1/chat/completions
#   "embed"     → Qwen3-Embedding-0.6B (1024-dim)     /v1/embeddings
#
# gpu_memory_utilization fractions are per engine and PRE-ALLOCATED at
# boot: chat 0.60 + embed 0.12 = 0.72 (headroom on purpose — the pilot
# card may drive a display).

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 12  # 5.5 (chat) + 1.2 (embed) + KV@16k + overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:` — the prebuilt ray-llm image owns the stack.
