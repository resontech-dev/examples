# Whisper large-v3 via vLLM — speech-to-text on one 12 GB worker.
#
# ⚠️ VALIDATE-BEFORE-LISTING: the catalog flags this entry "validate on
# our pinned vLLM before listing" (llms-catalog §3.8). Whisper is an
# encoder-decoder model served through the OpenAI transcription route —
# confirm the pinned ray-llm image exposes /v1/audio/transcriptions
# before selling this template. The predictor-mode fallback (faster-
# whisper in a predict() class) is the plan B if it doesn't.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 8   # ~3 GB fp16 weights + audio buffers + overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 16

# No `requirements:` — the prebuilt ray-llm image owns the stack.
