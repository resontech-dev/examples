# Qwen3-8B (AWQ) via vLLM — the cheap-tier chat workhorse, single worker.
#
# Catalog entry `chat-qwen3-8b` (priority v1): 119 languages, hybrid
# thinking mode, solid hermes tool calling — the baseline model for
# agent experiments (e.g. the BIM Level A/B experiment in this folder's
# README). AWQ 4-bit ≈ 5.5 GB weights → any 12 GB card; a 16 GB card
# (5070 Ti) runs the full 32k context with a roomy KV pool.

engine: vllm_openai

model:
  module: "serve_module"

vllm:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

cluster:
  num_workers: 1
  device: "gpu"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 10  # 5.5 GB weights + KV @ 32k + ~1 GB overhead
  # Advisory fields — dashboard/accounting only:
  mode: "data_parallel"
  max_ongoing_requests: 32

# No `requirements:` — the prebuilt ray-llm image owns the stack.
# See ../README.md "Requirements policy".
