# Piper TTS — Ukrainian / English / Italian speech on CPU (predictor mode).
#
# Text-to-speech at the lowest cost: ONNX voices, espeak-ng
# embedded in the wheel (no apt packages), MIT. Quality is "working", not
# studio — but it is the only Apache/MIT-clean Ukrainian TTS today
# (reson_docs → using-small-over-big-models/voice.md).

model:
  # No `path` — voices are pulled from HF `rhasspy/piper-voices` in __init__
  # (~60–80 MB per medium voice).
  module: "piper_serve"
  class_name: "PiperTTS"
  init_args:
    voices:                              # ⚠️ VERIFY names in the HF tree before deploy
      - "uk_UA-ukrainian_tts-medium"
      - "en_US-lessac-medium"
      - "it_IT-paola-medium"
    default_voice: "uk_UA-ukrainian_tts-medium"
    use_cuda: false                      # true needs onnxruntime-gpu in requirements + device: gpu

cluster:
  num_workers: 1
  mode: "data_parallel"
  gpus_per_worker: 1          # the SDK requires ≥ 1 (hardware_requirements.py); device: cpu keeps the model off the GPU
  cpus_per_worker: 4
  max_ongoing_requests: 4     # ~2–5× realtime per core; add replicas for more streams
  device: "cpu"

requirements:
  - "piper-tts>=1.3.0"
  - "huggingface_hub>=0.25"
