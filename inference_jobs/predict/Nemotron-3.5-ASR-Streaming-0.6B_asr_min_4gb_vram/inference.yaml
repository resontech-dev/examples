# Nemotron 3.5 ASR Streaming 0.6B (NVIDIA): low-latency speech-to-text in
# 40 language locales, Ukrainian (uk-UA) among the 19 transcription-ready
# ones (predictor mode).
#
# Cache-aware streaming FastConformer + RNN-T, 600M parameters,
# OpenMDW-1.1 (ready for commercial use). Released 2026-06-04; the
# multilingual successor of nemotron-speech-streaming-en-0.6b. Not a vLLM
# model: NeMo runs it inside predict(), whole files per request.
#
# VALIDATE before listing: written, not booted. VERIFY list in README.md.

model:
  # No `path`: NeMo pulls the checkpoint from HF Hub in __init__.
  module: "nemotron_serve"
  class_name: "NemotronStreamingASR"
  init_args:
    model_id: "nvidia/nemotron-3.5-asr-streaming-0.6b"
    # [left, right] attention context in 80 ms frames. The right value is the
    # latency a live session would have: 0 (80 ms), 1, 3, 6, 13 (1.12 s, the
    # most accurate). Files are not latency-bound, so 13.
    att_context_size: [56, 13]
    timestamps: false

cluster:
  num_workers: 1
  mode: "data_parallel"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 4   # ~2.4 GB fp32 weights; limited attention context keeps long files linear
  max_ongoing_requests: 4
  device: "gpu"

requirements:
  - "torch"                        # bare: bound by nemo_toolkit
  # The model card says NeMo main, but main now needs Python >= 3.12 and the
  # worker image is 3.11. NeMo 3.0.0 (PyPI, 2026-08-07) already has the
  # model's class, EncDecRNNTBPEModelWithPrompt, with target_lang.
  - "nemo_toolkit[asr]>=3.0"
  - "soundfile>=0.12.1"            # bundles libsndfile with MP3 support: no FFmpeg on the worker
  - "scipy"
  - "numpy"
  # The platform installs numpy<2 for every predictor job; pyarrow 26
  # (pulled in through `datasets`) refuses to import under numpy 1.x and
  # took Ray Serve down with it on 2026-11-18. Drop once the base allows numpy 2.
  - "pyarrow<26"
