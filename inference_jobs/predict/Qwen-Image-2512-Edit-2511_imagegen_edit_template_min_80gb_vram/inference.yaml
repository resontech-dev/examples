# ⚠️ TEMPLATE: Qwen-Image-2512 + Qwen-Image-Edit-2511, text-to-image and
# image editing (predictor mode).
#
# Two 20B MMDiT models from the Qwen team, Apache-2.0. A prompt goes to
# Qwen-Image-2512 (posters, product shots, people, Chinese and English text
# in the image); a prompt plus 1–3 images goes to Qwen-Image-Edit-2511
# ("make the header dark navy", "put the bear from image 1 next to the bear
# in image 2"). They share the text encoder and the VAE. Same request and
# response as the FLUX.2 klein job. Needs an 80 GB card.
# Written 2026-11-19; nothing has booted.

model:
  # No `path`: diffusers pulls ~99 GB in __init__ (2 × 40.9 GB transformers,
  # 16.6 GB Qwen2.5-VL-7B text encoder, 0.25 GB VAE; bf16).
  module: "qwen_image_edit_serve"
  class_name: "QwenImageGenEdit"
  init_args:
    t2i_model_id: "Qwen/Qwen-Image-2512"
    # null: text-to-image only, ~58 GB of weights, resident on an 80 GB card.
    edit_model_id: "Qwen/Qwen-Image-Edit-2511"
    # auto: resident when every weight fits with ~12 GiB to spare (both
    # models: ≥ 104 GiB, i.e. H200 / B200), otherwise model CPU offload.
    offload: "auto"
    t2i_steps: 50               # the 2512 card's setting; the model is not distilled
    edit_steps: 40              # the Edit-2511 card's setting
    max_steps: 80
    default_side: 1328          # 1328×1328 when no size and no image is sent
    max_area: 1763584           # 1328 × 1328 output cap; the cards' aspect presets all fit
    edit_area: 1048576          # edits without a size: ~1 MP in the first image's aspect
    max_refs: 3
    max_images: 2               # tens of seconds per image; 2 keeps a request under 300 s

cluster:
  num_workers: 1
  mode: "data_parallel"
  gpus_per_worker: 1
  cpus_per_worker: 8
  min_vram_gb_per_worker: 80       # offload peak: one 38 GiB transformer + activations; 48 GB untested
  min_host_ram_gb_per_worker: 128  # under offload all ~99 GB of weights wait in RAM
  min_disk_gb_per_worker: 140      # predictor image ~8 + 1.3 × ~99 GB
  # One image at a time on the GPU (a lock in the predictor). The 300 s
  # request cap counts the queue too: one running, one waiting.
  max_ongoing_requests: 2
  device: "gpu"

requirements:
  - "torch"                        # bare: the base image's build
  # 0.37 is the first release that reads Edit-2511's `zero_cond_t` (0.36 loads
  # the model and silently drops it); 0.40+ needs huggingface-hub 1.x, which
  # transformers 4 refuses.
  - "diffusers>=0.37.0,<0.40"
  - "transformers>=4.51.3,<5"      # Qwen2.5-VL text encoder
  - "accelerate>=1.0"              # enable_model_cpu_offload
  - "Pillow>=10.0.0"
